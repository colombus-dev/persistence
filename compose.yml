services:

  persistence_app:
    build: .
    depends_on:
      persistence_db:
        condition: service_healthy
        restart: true
    environment:
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_LOCALHOST: ${DATABASE_URL_LOCALHOST}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5
  persistence_db:
    image: postgres:19
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Variable not set}
      - POSTGRES_DB=app

volumes:
  app-db-data:
