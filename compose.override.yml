  persistence_app:
    ports:
      - "8187:8187"
    build: .
    develop:
      watch:
        - path: ./app/
          action: sync
          target: /persistence/app
          ignore:
            - .venv
        - path: pyproject.toml
          action: rebuild
    environment:
      FASTAPI_ENV: "development"
  persistence_db:
