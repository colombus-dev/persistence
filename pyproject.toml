[project]
name = "persistence"
version = "0.1.0"
description = "Persistence - The persistence layer for Colombus"
readme = "README.md"
authors = []
requires-python = "==3.14.*"
dependencies = [
    "alembic==1.20.1",
    "fastapi[standard]==0.165.0",
    "psycopg[binary]==3.3.9",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "sqlmodel==0.0.50",
    "strawberry-graphql[fastapi]>=0.341.2",
    "strawberry-sqlalchemy-mapper==0.9.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pyrefly==1.5.0",
    "ruff==0.17.6",
    "coverage==7.17.3",
    "bandit[toml]==1.9.4",
    "vulture==2.16",
    "prek==0.5.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py314"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.ruff.lint.per-file-ignores]
# SQLModel self-referential relationships need the string forward-ref
# (`Optional["Step"]`) so SQLAlchemy can resolve the mapper lazily at runtime.
# UP037 removes the quotes and UP007/UP045 rewrite `Optional[...]` to
# `... | None`; either would break mapper resolution, so both are ignored here.
"app/db/models.py" = ["UP007", "UP037", "UP045"]

[tool.vulture]
min_confidence = 70
sort_by_size = true
paths = ["app/"]

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
project-excludes = [
    "venv",
    ".venv",
    "alembic",
    "tests",
]

[tool.bandit]
include_dirs = ["app"]

[tool.fastapi]
entrypoint = "app.main:app"
